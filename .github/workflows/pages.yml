name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check scripts for syntax errors
        run: for f in site/*.js; do node --check "$f"; done

      # GitHub Pages lets browsers cache files for 10 minutes. Adding the commit
      # to each file link makes browsers fetch the new CSS and JS after every deploy.
      - name: Version asset links
        run: |
          sed -i -E "s/(app\.css|config\.js|content\.js|app\.js)\"/\1?v=${GITHUB_SHA::7}\"/g" site/index.html
          grep -E "\?v=" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
